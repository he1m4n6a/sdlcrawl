    type: "rss"
    url: "https://paper.seebug.org/rss/"
    category: "Vulnerability Research"
    enabled: true

  - name: "Tencent Keen Lab (腾讯科恩)"
    type: "rss"
    url: "https://keenlab.tencent.com/zh/atom.xml"
    category: "Vulnerability Research"
    enabled: true

  - name: "SlowMist (慢雾科技)"
    type: "rss"
    url: "https://medium.com/feed/slowmist"
    category: "Blockchain Security"
    enabled: true

  - name: "FreeBuf (安全资讯)"
    type: "rss"
    url: "https://www.freebuf.com/feed"
    category: "Security News"
    enabled: true

# AI 相关安全源
ai_security_sources:
  - name: "OpenAI Security"
    type: "rss"
    url: "https://openai.com/blog/rss.xml"
    category: "AI Security"
    enabled: true

  - name: "Anthropic Safety"
    type: "html"
    url: "https://www.anthropic.com/index"
    category: "AI Safety"
    enabled: true

  - name: "Google DeepMind Safety"
    type: "rss"
    url: "https://deepmind.google/discover/blog/feed/"
    category: "AI Safety"
    enabled: true

  - name: "Microsoft AI Safety"
    type: "rss"
    url: "https://www.microsoft.com/en-us/research/blog/topic/artificial-intelligence/feed/"
    category: "AI Safety"
    enabled: true

  - name: "AI Security Newsletter"
    type: "rss"
    url: "https://newsletter.aisec.substack.com/feed"
    category: "AI Security"
    enabled: true

# Twitter/X Sources (Currently Disabled due to API limitations)
# twitter_security_experts:
#   Note: Direct X scraping is unreliable without Enterprise API. 
#   We are using their blogs/RSS where available.

# 关键词过滤
keywords:
  include:
    # SDL, DevSecOps, AppSec
    - "SDL"
    - "secure development"
    - "DevSecOps"
    - "secure coding"
    - "application security"
    - "appsec"
    - "software supply chain"
    - "threat model"
    - "code review"
    - "static analysis"
    - "SAST"
    - "DAST"
    - "secret management"
    - "container security"
    - "security"
    - "cyber"
    - "attack"
    - "breach"
    
    # Vulnerabilities & Threats
    - "vulnerability"
    - "zero-day"
    - "0day"
    - "CVE"
    - "RCE"
    - "exploit"
    - "malware"
    - "ransomware"
    - "apt group"
    
    # AI Security
    - "AI security"
    - "LLM security"
    - "prompt injection"
    - "adversarial attack"
    - "model poisoning"
    - "AI safety"
    
  exclude:
    - "advertisement"
    - "sponsored"
    - "promo"
    - "webinar registration"
