# 关键词过滤
keywords:
  include:
    # SDL 相关
    - "SDL"
    - "secure development"
    - "DevSecOps"
    - "secure coding"
    - "code security"
    - "application security"
    - "appsec"
    
    # 安全工具
    - "SAST"
    - "DAST"
    - "IAST"
    - "SCA"
    - "AST"
    - "penetration testing"
    - "pen test"
    - "vulnerability scanning"
    - "bug bounty"
    
    # 威胁研究
    - "vulnerability"
    - "zero-day"
    - "0day"
    - "CVE"
    - "exploit"
    - "threat"
    - "threat intelligence"
    - "malware"
    - "ransomware"
    
    # AI 安全
    - "AI security"
    - "LLM security"
    - "prompt injection"
    - "adversarial attack"
    - "model safety"
    - "AI safety"
    - "machine learning security"
    - "deep learning security"
    
    # 中国关键词
    - "安全开发"
    - "应用安全"
    - "漏洞分析"
    - "漏洞挖掘"
    - "渗透测试"
    - "威胁情报"
    - "恶意代码"
    - "勒索软件"
    - "0day"
    - "零日"
    - "安全研究"
    - "攻防演练"
    - "红蓝对抗"
    - "云安全"
    - "网络安全"
    - "数据安全"
    - "隐私保护"
    
  exclude:
    - "advertisement"
    - "sponsored"
    - "广告"
    - "赞助"
    - "推广"
