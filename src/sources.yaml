# 安全资讯源配置

# 国际安全博客和媒体
sources:
  # High Quality General Security
  - name: "The Hacker News"
    type: "rss"
    url: "https://thehackernews.com/feeds/posts/default"
    category: "General"
    enabled: true

  - name: "Dark Reading"
    type: "rss"
    url: "https://www.darkreading.com/rss.xml"
    category: "General"
    enabled: true

  - name: "BleepingComputer"
    type: "rss"
    url: "https://www.bleepingcomputer.com/feed/"
    category: "General"
    enabled: true

  - name: "SecurityWeek"
    type: "rss"
    url: "https://www.securityweek.com/feed"
    category: "General"
    enabled: true

  # Technical & Research
  - name: "Krebs on Security"
    type: "rss"
    url: "https://krebsonsecurity.com/feed/"
    category: "Investigative"
    enabled: true

  - name: "Schneier on Security"
    type: "rss"
    url: "https://www.schneier.com/feed/atom/"
    category: "Security Engineering"
    enabled: true

  - name: "SANS Internet Storm Center"
    type: "rss"
    url: "https://isc.sans.edu/rssfeed.xml"
    category: "Threat Intelligence"
    enabled: true

  # Corporate & Cloud Security Blogs
  - name: "Google Security Blog"
    type: "rss"
    url: "https://security.googleblog.com/feeds/posts/default"
    category: "AppSec"
    enabled: true

  - name: "Microsoft Security Blog"
    type: "rss"
    url: "https://www.microsoft.com/en-us/security/blog/feed/"
    category: "AppSec"
    enabled: true

  - name: "AWS Security Blog"
    type: "rss"
    url: "https://aws.amazon.com/blogs/security/feed/"
    category: "Cloud Security"
    enabled: true

  - name: "Cloudflare Blog"
    type: "rss"
    url: "https://blog.cloudflare.com/rss/"
    category: "Web Security"
    enabled: true

  - name: "CrowdStrike Blog"
    type: "rss"
    url: "https://www.crowdstrike.com/blog/feed/"
    category: "Endpoint Security"
    enabled: true

  - name: "Mandiant Blog"
    type: "rss"
    url: "https://www.mandiant.com/resources/blog/rss.xml"
    category: "Threat Intelligence"
    enabled: true

  - name: "WeLiveSecurity (ESET)"
    type: "rss"
    url: "https://www.welivesecurity.com/feed/"
    category: "Malware Research"
    enabled: true

  # AppSec & Bug Bounty
  - name: "PortSwigger Blog"
    type: "rss"
    url: "https://portswigger.net/blog/rss"
    category: "Web Security"
    enabled: true

  - name: "HackerOne Blog"
    type: "rss"
    url: "https://www.hackerone.com/blog"
    category: "Bug Bounty"
    enabled: true

  - name: "GitHub Security Lab"
    type: "rss"
    url: "https://github.blog/tag/security/feed/"
    category: "Code Security"
    enabled: true

  # SDL & AppSec Specific
  - name: "OWASP"
    type: "rss"
    url: "https://owasp.org/feed.xml"
    category: "AppSec Standard"
    enabled: true

  - name: "Netflix Tech Blog (Security)"
    type: "rss"
    url: "https://netflixtechblog.com/feed/tagged/security"
    category: "DevSecOps"
    enabled: true

  - name: "Google Project Zero"
    type: "rss"
    url: "https://googleprojectzero.blogspot.com/feeds/posts/default"
    category: "Vulnerability Research"
    enabled: true

# 国内优质源 (High Quality Chinese Sources)
